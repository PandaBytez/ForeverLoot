name: Release ForeverLoot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package AddOn
        run: |
          zip -r "ForeverLoot-${GITHUB_REF_NAME}.zip" \
            ForeverLoot \
            ForeverLoot_Collections \
            ForeverLoot_Crafting \
            ForeverLoot_Data \
            ForeverLoot_DungeonsAndRaids \
            ForeverLoot_Factions \
            ForeverLoot_Options \
            ForeverLoot_PvP

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "ForeverLoot-${GITHUB_REF_NAME}.zip" \
            --title "ForeverLoot ${GITHUB_REF_NAME}" \
            --generate-notes
